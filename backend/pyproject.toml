[project]
name = "prosta-ai"
version = "0.1.0"
description = "Prosta-AI: segmentación 3D experimental de próstata en MRI (uso académico, no diagnóstico)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "python-multipart==0.0.20",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "bcrypt==4.2.1",
  "pyjwt==2.10.1",
  "numpy==1.26.4",
  "nibabel==5.3.2",
  "pydicom==2.4.4",
  "SimpleITK==2.4.0",
  "monai==1.4.0",
  "torch==2.5.1",
  "pillow==11.1.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["prosta_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"prosta_ai.recursos" = ["*.ttf", "*.txt"]
